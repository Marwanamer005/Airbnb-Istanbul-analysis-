<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 138" role="img" aria-label="Kervan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.kv-pin{animation:kvDrop .9s cubic-bezier(.3,.75,.35,1) both;transform-box:view-box;transform-origin:50px 114px}
.kv-city{animation:kvRise .7s .5s cubic-bezier(.2,.8,.3,1) both}
.kv-wave{animation:kvWave .7s .7s ease-out both;transform-box:fill-box;transform-origin:left center}
.kv-l{animation:kvIn .45s calc(.85s + var(--i) * .06s) ease-out both}
@keyframes kvDrop{0%{transform:translateY(-38px);opacity:0}55%{transform:translateY(3px);opacity:1}75%{transform:translateY(-2px) scale(1.02,.98)}100%{transform:none}}
@keyframes kvRise{from{transform:translateY(30px)}to{transform:none}}
@keyframes kvWave{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes kvIn{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.kv-pin,.kv-city,.kv-wave,.kv-l{animation:none}}
</style><defs><mask id="kvm-hole" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="100" height="120" fill="#fff"/><circle cx="50" cy="43" r="25" fill="#000"/></mask><clipPath id="kvm-in"><circle cx="50" cy="43" r="25.6"/></clipPath></defs><path class="kv-wave" fill="#5474a1" d="M8 128C26 118 46 133 70 125 78 122.5 86 120.5 93 120.5 84 125.5 74 131 62 133 42 136 26 125 8 128Z"/><g class="kv-pin"><path fill="#b36633" mask="url(#kvm-hole)" d="M50 114C40 99 11 74 11 43A39 39 0 1 1 89 43C89 74 60 99 50 114Z"/><g clip-path="url(#kvm-in)"><path class="kv-city" fill="#b36633" d="M18 58H82V80H18ZM26 58.5A16 15.5 0 0 1 58 58.5ZM19 59.5A6 6 0 0 1 31 59.5Z M54 59.5A6 6 0 0 1 66 59.5ZM41.1 43.6L42 35 42.9 43.6ZM60.5 59V29H65.5V59Z M59.3 35.5H66.7V38.3H59.3Z M60.5 29L63 18.5 65.5 29Z"/></g></g></svg>