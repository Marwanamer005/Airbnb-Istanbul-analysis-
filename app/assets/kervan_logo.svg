<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 138" role="img" aria-label="Kervan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.kv-pin{animation:kvDrop .9s cubic-bezier(.3,.75,.35,1) both;transform-box:view-box;transform-origin:50px 114px}
.kv-city{animation:kvRise .7s .5s cubic-bezier(.2,.8,.3,1) both}
.kv-wave{animation:kvWave .7s .7s ease-out both;transform-box:fill-box;transform-origin:left center}
.kv-l{animation:kvIn .45s calc(.85s + var(--i) * .06s) ease-out both}
@keyframes kvDrop{0%{transform:translateY(-38px);opacity:0}55%{transform:translateY(3px);opacity:1}75%{transform:translateY(-2px) scale(1.02,.98)}100%{transform:none}}
@keyframes kvRise{from{transform:translateY(30px)}to{transform:none}}
@keyframes kvWave{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes kvIn{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.kv-pin,.kv-city,.kv-wave,.kv-l{animation:none}}
